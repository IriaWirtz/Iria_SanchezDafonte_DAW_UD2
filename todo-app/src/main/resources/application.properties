spring.application.name=todo-app
server.port=8080

# ---------------------------------------------------------------------------
# Conexión a MariaDB
# Los valores NO están en este fichero: se leen de variables de entorno.
#
#   DB_HOST       servidor de base de datos (nombre del servicio o contenedor)
#   DB_PORT       puerto de MariaDB (opcional, por defecto 3306)
#   DB_NAME       nombre de la base de datos
#   DB_USER       usuario de la base de datos
#   DB_PASSWORD   contraseña del usuario
#
# Si falta alguna de las obligatorias, la aplicación no arranca y el error
# indica cuál es:  Could not resolve placeholder 'DB_NAME'
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza la tabla "tareas" al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
